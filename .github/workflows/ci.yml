name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Lint the hook
        if: runner.os == 'Linux'
        run: shellcheck -x ../claude-plugin/hooks/register.sh ../claude-plugin/hooks/status.sh ../claude-plugin/hooks/lib.sh
